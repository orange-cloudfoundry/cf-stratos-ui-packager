name: releaser

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stratos release tag (required when running from a branch)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Select release tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "$INPUT_TAG" ] && [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "Select a tag or provide release_tag" >&2
            exit 1
          fi
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          git check-ref-format "refs/tags/$tag"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: release-source
          submodules: true
      - name: Verify Stratos version
        run: bash bin/verify-stratos "$RELEASE_TAG" release-source
      - name: Read Stratos tool versions
        id: versions
        run: bash bin/stratos-tool-versions release-source >> "$GITHUB_OUTPUT"
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}
      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.versions.outputs.bun }}
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.versions.outputs.golang }}
          cache: false
      - name: Install dependencies
        working-directory: release-source/stratos-ui
        run: bun install --frozen-lockfile
      - name: package
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=5500
        run: bash bin/package-stratos "$RELEASE_TAG" release-source
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: |
            stratos-ui.zip
