name: Update and tag

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-stratos
  cancel-in-progress: false

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          submodules: true

      - name: Update Stratos and tag
        id: update
        run: |
          set -euo pipefail
          tag="$(bash bin/update-stratos)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Ensure release is published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.update.outputs.tag }}
        run: bash bin/ensure-release "$TAG"
